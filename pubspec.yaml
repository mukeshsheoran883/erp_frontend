name: invently
description: "invently Biller - Manage your business at your fingertip"
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.3+3

environment:
  sdk: '>=3.4.4 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  flutter_secure_storage: ^9.2.2
  google_fonts: ^6.2.1
  go_router: ^14.2.1
  responsive_framework: ^0.2.0
  provider: ^6.1.2
  envied: ^1.0.0
  dio: ^5.5.0+1
  collection: ^1.18.0
  intl: ^0.20.2
  hive: ^2.2.3
  window_manager: ^0.5.2
  flutter_styled_toast:
    git:
      url: 'https://github.com/CHRISTOPANANJICKAL/flutter_styled_toast'
  file_picker: ^8.1.7
  flutter_svg: ^2.0.10+1
  fast_cached_network_image: ^1.2.9
  universal_html: ^2.2.4
  path_provider: ^2.1.3
  shimmer: ^3.0.0
  url_launcher: ^6.3.0
  fast_validator: ^0.3.0
  flutter_spinkit: ^5.2.1
  flutter_advanced_switch: ^3.1.0
  package_info_plus: ^8.0.0
  uuid: ^4.5.1
  flutter_analog_clock: ^1.0.3
  gusto_neumorphic: ^3.3.0
  screenshot: ^3.0.0
  flutter_inappwebview: ^6.1.5


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_gen: ^5.6.0
  flutter_gen_runner: ^5.6.0
  envied_generator: ^1.0.0
  build_runner: ^2.4.11
  integration_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/
    - assets/images/
    - assets/files/

  # fonts:
